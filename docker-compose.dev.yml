version: '3.8'
services:
  event-service:
    build: ./EventosYPromociones
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3005
      - DATABASE_SERVICE_URL=http://database-service:3005
    ports:
      - "4005:4005"
    depends_on:
      - db
      - database-service
    networks:
      - dev-network

  event-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - events_db_data:/var/lib/mysql
    networks:
      - dev-network

  event-service-db:
    build:
      context: ./Database
      dockerfile: dockerfile
    env_file:
      - ../.env
    environment:
      - DB_HOST=event-mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=4005
    depends_on:
      - db
    networks:
      - dev-network
    ports:
      - "$3005:3005"

volumes:
  events_db_data:

networks:
  dev-network:
    driver: bridge
